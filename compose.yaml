services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DHCP_ENABLED: ${DHCP_ENABLED:-false}
      KEA1_API_URL: ${KEA1_API_URL:-}
      KEA1_API_USERNAME: ${KEA1_API_USERNAME:-}
      KEA1_API_PASSWORD: ${KEA1_API_PASSWORD:-}
      KEA2_API_URL: ${KEA2_API_URL:-}
      KEA2_API_USERNAME: ${KEA2_API_USERNAME:-}
      KEA2_API_PASSWORD: ${KEA2_API_PASSWORD:-}
      DATABASE_URL: ${DATABASE_URL:-jdbc:h2:file:./data/dns-probe}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-dnsprobe}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      DNS_MODE: ${DNS_MODE:-demo}
      DNS_ADMIN_USERNAME: ${DNS_ADMIN_USERNAME:-admin}
      DNS_ADMIN_PASSWORD: ${DNS_ADMIN_PASSWORD:-}
      DNS_VIEWER_USERNAME: ${DNS_VIEWER_USERNAME:-viewer}
      DNS_VIEWER_PASSWORD: ${DNS_VIEWER_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/app/config/
      DNS_WEB_TSIG_SECRET: ${DNS_WEB_TSIG_SECRET:-}
    volumes:
      - audit-data:/app/data
      - ./deploy/config:/app/config:ro
    expose: ["8080"]
    security_opt: ["no-new-privileges:true"]
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${LISTEN_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8088}:8080"
    security_opt: ["no-new-privileges:true"]
volumes:
  audit-data:
