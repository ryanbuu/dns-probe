services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${INFRAPILOT_POSTGRES_PASSWORD:?Set an independent PostgreSQL admin password}
      INFRAPILOT_DATABASE_PASSWORD: ${INFRAPILOT_DATABASE_PASSWORD:?Set an independent application password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-infrapilot.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
  backend:
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
