# Copy to deploy/config/application.yml and change DNS_MODE=live in .env.
# The mounted config directory is loaded after the packaged defaults.
probe:
  keys:
    web:
      name: dns-probe.intra.example.com.
      algorithm: hmac-sha256
      secret: ${DNS_WEB_TSIG_SECRET}
  zones:
    - id: intra
      name: intra.example.com.
      description: 基础设施与内部服务
      read-only: false
      key: web
      primary: { label: bind1, host: 192.0.2.10, port: 53 }
      secondaries: [{ label: bind2, host: 192.0.2.11, port: 53 }]
      protected-suffixes: [dhcp.intra.example.com.]
    - id: reverse-infra
      name: 2.0.192.in-addr.arpa.
      description: 基础设施反向解析
      read-only: false
      key: web
      primary: { label: bind1, host: 192.0.2.10, port: 53 }
      secondaries: [{ label: bind2, host: 192.0.2.11, port: 53 }]
    - id: dhcp
      name: dhcp.intra.example.com.
      description: Kea Internal / IoT 自动维护
      read-only: true
      key: web
      primary: { label: bind1, host: 192.0.2.10, port: 53 }
      secondaries: [{ label: bind2, host: 192.0.2.11, port: 53 }]
    - id: reverse-internal
      name: 100.51.198.in-addr.arpa.
      description: Kea Internal 自动维护
      read-only: true
      key: web
      primary: { label: bind1, host: 192.0.2.10, port: 53 }
      secondaries: [{ label: bind2, host: 192.0.2.11, port: 53 }]
    - id: reverse-iot
      name: 113.0.203.in-addr.arpa.
      description: Kea IoT 自动维护
      read-only: true
      key: web
      primary: { label: bind1, host: 192.0.2.10, port: 53 }
      secondaries: [{ label: bind2, host: 192.0.2.11, port: 53 }]
