server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  application:
    name: dns-probe
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/dns-probe}
    username: ${DATABASE_USERNAME:dnsprobe}
    password: ${DATABASE_PASSWORD:}
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
probe:
  mode: ${DNS_MODE:demo}
  admin-username: ${DNS_ADMIN_USERNAME:admin}
  admin-password: ${DNS_ADMIN_PASSWORD:}
  viewer-username: ${DNS_VIEWER_USERNAME:viewer}
  viewer-password: ${DNS_VIEWER_PASSWORD:}
  timeout-seconds: 5

  dhcp:
    enabled: ${DHCP_ENABLED:false}
    nodes:
      - id: kea1
        label: kea1
        url: ${KEA1_API_URL:}
        username: ${KEA1_API_USERNAME:}
        password: ${KEA1_API_PASSWORD:}
      - id: kea2
        label: kea2
        url: ${KEA2_API_URL:}
        username: ${KEA2_API_USERNAME:}
        password: ${KEA2_API_PASSWORD:}
